name: Deploy Bioscience Engine to Cloud Run

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker to Artifact Registry
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Build and Push Container
      run: |
        IMAGE="us-central1-docker.pkg.dev/gen-lang-client-0973854052/cloud-run-source-deploy/zerolabz-bioscience-engine:${{ github.sha }}"
        docker build -t $IMAGE .
        docker push $IMAGE

    - name: Deploy to Cloud Run
      run: |
        IMAGE="us-central1-docker.pkg.dev/gen-lang-client-0973854052/cloud-run-source-deploy/zerolabz-bioscience-engine:${{ github.sha }}"
        gcloud run deploy zerolabz-bioscience-engine \
          --image $IMAGE \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated \
          --timeout=300
